name: 功能建议
description: 想加能力，或现有流程不好用
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先用 Issue 说清楚要解决什么。有代码后再开 PR。
  - type: textarea
    id: problem
    attributes:
      label: 现在缺什么
      description: 先写痛点，不要只写「希望加一个按钮」。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议怎么做
      description: 你认为合理的做法；不确定也可以只描述结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现在怎么绕过
      description: 现有功能、脚本或其他 App 是否已经能做。
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 这不是检测绕过、DRM、反作弊、支付或访问控制规避的请求。
          required: true
        - label: 我知道项目不接受全局关闭 Gatekeeper、FairPlay 脱壳，以及捆绑或镜像第三方二进制。
          required: true
